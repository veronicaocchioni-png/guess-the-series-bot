<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guess the Series</title>
  <style>
    :root {
      --bg: #f7f3ec;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5dfd3;
      --accent: #c2410c;
      --user: #1f2937;
    }
    * { box-sizing: border-box; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; transition: background 0.6s ease; }
    .app { width: 100%; max-width: 720px; min-height: 100vh; display: flex; flex-direction: column; padding: 28px 18px; gap: 16px; }
    h1 { margin: 0; font-size: 3.2rem; line-height: 1.05; letter-spacing: -1px; }
    .sub { margin: 0; color: var(--muted); font-size: 1.1rem; font-family: system-ui, sans-serif; }

    .temp { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; font-family: system-ui, sans-serif; }
    .temp-top { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
    .temp-top strong { color: var(--text); font-size: 0.95rem; text-transform: none; letter-spacing: 0; }
    .temp input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px; outline: none; background: linear-gradient(to right, #3b82f6, #f59e0b, #ef4444); }
    .temp input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #ffffff; border: 3px solid var(--text); cursor: pointer; }
    .temp input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #ffffff; border: 3px solid var(--text); cursor: pointer; }
    .temp small { color: var(--muted); display: block; margin-top: 12px; line-height: 1.4; }

    #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px 0; min-height: 280px; font-family: system-ui, sans-serif; }
    .msg { padding: 12px 16px; border-radius: 16px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; }
    .bot { background: var(--card); border: 1px solid var(--border); align-self: flex-start; }
    .user { background: var(--user); color: #ffffff; align-self: flex-end; }
    .note { align-self: center; color: var(--muted); font-size: 0.85rem; font-style: italic; }

    form { display: flex; gap: 10px; font-family: system-ui, sans-serif; }
    #input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1rem; }
    #input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button { padding: 14px 20px; border: none; border-radius: 12px; background: var(--accent); color: white; font-size: 1rem; cursor: pointer; font-family: system-ui, sans-serif; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #newgame { background: transparent; color: var(--text); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="app">
    <h1>Guess the Series</h1>
    <p class="sub">I'm thinking of a TV series. Ask for clues and try to guess it.</p>

    <div class="temp">
      <div class="temp-top">
        <span>Cold</span>
        <strong id="tempValue">Temperature: 0.7</strong>
        <span>Hot</span>
      </div>
      <input type="range" id="temp" min="0" max="1.2" step="0.1" value="0.7" />
      <small>Low temperature = predictable, formal clues. High temperature = unpredictable, creative and funny clues.</small>
    </div>

    <div id="chat"></div>

    <form id="form">
      <input id="input" placeholder="Type your guess or ask for a clue..." autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
    <button id="newgame" type="button">🔄 New game</button>
  </div>

  <script>
    const SERIES = [
      "Breaking Bad", "Stranger Things", "Game of Thrones", "Friends", "The Office",
      "Squid Game", "The Crown", "Black Mirror", "Money Heist", "Wednesday",
      "The Simpsons", "Peaky Blinders", "The Witcher", "Sherlock", "Lost",
      "Euphoria", "Succession", "The Mandalorian", "Gossip Girl", "Emily in Paris"
    ];

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const tempSlider = document.getElementById("temp");
    const tempValue = document.getElementById("tempValue");

    let secret = "";
    let history = [];
        // Background color follows the temperature: cold blue -> warm cream -> hot orange
    function updateBackground() {
      const t = parseFloat(tempSlider.value) / 1.2; // 0 to 1
      let color;
      if (t <= 0.5) {
        // cold (light blue) -> neutral (cream)
        const k = t / 0.5;
        color = mix([219, 234, 254], [247, 243, 236], k);
      } else {
        // neutral (cream) -> hot (light orange)
        const k = (t - 0.5) / 0.5;
        color = mix([247, 243, 236], [254, 215, 170], k);
      }
      document.body.style.background = color;
    }

    function mix(a, b, k) {
      const r = Math.round(a[0] + (b[0] - a[0]) * k);
      const g = Math.round(a[1] + (b[1] - a[1]) * k);
      const bl = Math.round(a[2] + (b[2] - a[2]) * k);
      return "rgb(" + r + "," + g + "," + bl + ")";
    }

    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addNote(text) {
      const div = document.createElement("div");
      div.className = "note";
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function askBot() {
      sendBtn.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: history,
            temperature: parseFloat(tempSlider.value),
            secret: secret
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        history.push({ role: "assistant", content: data.reply });
        addMessage(data.reply, "bot");
      } catch (err) {
        addNote("Error: " + err.message);
      }
      sendBtn.disabled = false;
      input.focus();
    }

    function newGame() {
      chat.innerHTML = "";
      secret = SERIES[Math.floor(Math.random() * SERIES.length)];
      history = [{ role: "user", content: "Start the game and give me the first clue." }];
      askBot();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      history.push({ role: "user", content: text });
      addMessage(text, "user");
      askBot();
    });

    tempSlider.addEventListener("input", () => {
      tempValue.textContent = "Temperature: " + tempSlider.value;
    });

    tempSlider.addEventListener("input", () => {
  tempValue.textContent = "Temperature: " + tempSlider.value;
  updateBackground();
});

    document.getElementById("newgame").addEventListener("click", newGame);

    updateBackground();
newGame();
  </script>
</body>
</html>
